[project]
name = "spankbang-dl"
version = "0.1.0"
description = "批量采集 SpankBang 播放列表，解析最高清晰度直链并下载到本地"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pathvalidate>=3.2",
    "mutagen>=1.47",
]

[project.scripts]
spankbang-dl = "spankbang_dl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spankbang_dl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
